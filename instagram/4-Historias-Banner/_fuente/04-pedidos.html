<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Historia · Pedidos</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
  .title { top: 292px; }
  /* tira de fotos */
  .round { width: 190px; height: 190px; top: 470px; border-width: 5px; box-shadow: 0 0 0 9px var(--cream); }
  .p1 { left: 295px; } .p2 { left: 445px; z-index: 2; } .p3 { left: 595px; }
  .round .ph { background-size: 185% auto; }
  .p1 .ph { background-image: url(../../../assets/antojo-de-mi-tierra.jpg); background-position: 50% 62%; }
  .p2 .ph { background-image: url(../../../assets/sinfonia.jpg); background-position: 50% 58%; }
  .p3 .ph { background-image: url(../../../assets/vibranburguesa.jpg); background-position: 50% 62%; }

  /* línea de tiempo */
  .steps { position: absolute; left: 100px; right: 100px; top: 770px; }
  .steps::before { content: ""; position: absolute; left: 59px; top: 60px; bottom: 60px; width: 3px; background: linear-gradient(var(--gold), rgba(198,161,91,.35)); }
  .step { position: relative; display: flex; align-items: center; gap: 44px; height: 214px; }
  .num { flex: none; width: 120px; height: 120px; border-radius: 50%; background: var(--wine); color: var(--gold-light); display: grid; place-items: center; font-family: var(--font-body); font-weight: 400; font-size: 52px; box-shadow: 0 0 0 12px var(--cream); position: relative; }
  .step h2 { font-family: var(--font-display); font-weight: 500; font-size: 56px; line-height: 1.05; color: var(--wine); }
  .step p { margin-top: 8px; font-size: 30px; line-height: 1.3; color: var(--muted); }

  .btn { top: 1440px; height: 104px; padding: 0 54px; font-size: 31px; }
  .btn svg { width: 44px; height: 44px; flex: none; }
  .tel { position: absolute; left: 0; right: 0; top: 1586px; text-align: center; font-weight: 400; font-size: 27px; letter-spacing: .3em; color: var(--gold-deep); padding-left: .3em; }
  .foot { top: 1660px; color: var(--wine); }
</style></head>
<body class="light">
  <div class="ring r1"></div>

  <div class="eyebrow">Pedidos</div>
  <h1 class="title">Pedir es <em>muy fácil</em></h1>

  <div class="round p1"><div class="ph"></div></div>
  <div class="round p2"><div class="ph"></div></div>
  <div class="round p3"><div class="ph"></div></div>

  <div class="steps">
    <div class="step"><div class="num">1</div><div><h2>Elige tus pasabocas</h2><p>Mira el menú y escoge tus favoritos.</p></div></div>
    <div class="step"><div class="num">2</div><div><h2>Cuéntanos tu evento</h2><p>Fecha, lugar y número de invitados.</p></div></div>
    <div class="step"><div class="num">3</div><div><h2>Recibe tu cotización</h2><p>Te respondemos por WhatsApp y confirmas.</p></div></div>
  </div>

  <div class="btn">
    <svg viewBox="0 0 24 24" fill="none" stroke="#E3C98F" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 11.6a8.4 8.4 0 0 1-12.4 7.4L3.5 20.5l1.6-4.5A8.4 8.4 0 1 1 20.5 11.6z"/><path d="M9 8.6c.3 3 2.6 5.4 5.8 6.1l1.2-1.4-2.2-1-.9.8c-.9-.4-1.7-1.2-2.1-2.1l.8-.9-1-2.2z"/></svg>
    Haz tu pedido
  </div>
  <div class="tel">WHATSAPP +57 305 317 2716</div>
  <div class="foot brand">Vibrans Gourmet</div>
</body></html>
